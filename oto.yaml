      description: >-
        ### Shipment Transactions


        **Available Packages:** All Packages


        This API endpoint provides users with access to detailed information
        about shipment transactions. This API is designed to retrieve and
        display key transaction data, allowing users to monitor and review
        shipment-related activities.It retrieves shipment transactions with the
        option to paginate and filter by minimum and maximum dates.


        **Note:**


        If orderId exists maxDate and minDate are not required.


        If shipment number exists maxDate and minDate are not required.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | perPage | no | number | The number of transactions to be included per
        page. |

        | page | no | number | The page number for paginated results. |

        | minDate | yes (If there is no orderId) | date | Starting "Transaction
        Date" of your credit transactions in "yyyy-mm-dd" format. |

        | maxDate | yes (If there is no orderId) | date | Ending "Transaction
        Date" of your credit transactions in "yyyy-mm-dd" format. |

        | orderId | no | string | Order ID for transactions of a single Order |

        | shipmentNumber | no | string | Shipment Number for transactions of a
        single shipment |


        #### Response Body


        The response will include a `success` flag indicating the status of the
        request, and an `shipments` array containing transaction details. Each
        transaction object in the `shipments` array includes the following
        properties:


        ``` json

        {
          "success": true,
          "shipments": [
            {
              "shipmentNumnber": "1231231AS",
              "orderId": "123123",
              "shipmentCreationDate": "2023-12-05T06:47:46",
              "deliveryCompanyName": "deliveryCompany",
              "dcConnectionName": "connectionName",
              "shipmentType": "Forward Shipment",
              "dcCharge": 25,
              "currency": "TRY",
              "originalWeight": 100,
              "dcUpdatedWeight": 50,
              "status": "status",
              "dcInvoiceNumber": 15579456
            }

         ```
