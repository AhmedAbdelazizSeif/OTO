openapi: 3.0.0
info:
  title: OTO API V2
  version: 1.0.0
  description: >-
    ## Overview


    The **OTO REST API v2** enables you to integrate OTO’s logistics, delivery,
    and fulfillment capabilities directly into your own systems. It provides
    endpoints to create and manage orders and shipments, query delivery options
    and fees, manage stock and products, handle returns, and synchronize account
    and sales channel data.


    This Postman collection is structured to help you:

    - Authenticate and verify connectivity

    - Explore core resources (Orders, Shipments, Products, Stock, Brands, Pickup
    Locations, Sales Channels, Webhooks, etc.)

    - Implement end‑to‑end workflows such as order creation, shipment booking,
    tracking, and returns


    Use this collection as both **reference documentation** and a **runnable
    guide** during your integration.


    ---


    ## Authentication


    OTO uses a token‑based authentication model.


    1. **Obtain an access token**  
       Use the endpoints in the **Authorization** and/or **Marketplace** folders (for example, registration and client info / token generation endpoints) to get your **access token**.

    2. **Send the token in each request**  
       Unless the specific endpoint’s documentation states otherwise, include the token in one of the following standard ways:
       - As an HTTP header (recommended):
         ```http
         Authorization: Bearer <YOUR_ACCESS_TOKEN>
         ```
       - Or, where explicitly documented by OTO, as a request parameter or body field.

    3. **Token refresh**  
       Use the **Refresh Token** endpoint in the **Authorization** folder when your token expires. The response will contain a new token that you should start using in subsequent requests.

    4. **Testing authentication**  
       After setting your token, use the **Health Check** endpoint in the **Authorization** folder (or a simple info endpoint such as *Account Info* in the **Account** folder) to verify that authentication is working.

    > Tip: Configure your token once (for example, in the collection’s Auth tab
    or as an environment/collection variable) so it is automatically applied to
    all requests.


    ---


    ## Base URLs & Environments


    All OTO REST API v2 endpoints are served over HTTPS.


    - **Production base URL**  
      ```text
      https://api.tryoto.com/rest/v2
      ```
    - **Staging (Dev) base URL**  
      ```text
      https://staging-api.tryoto.com/rest/v2
      ```

    This collection defines two collection‑level variables to help you switch
    between production and staging without editing each request:


    - `{{real-url}}` – points to the **production** base URL

    - `{{test-url}}` – intended to point to the **staging** base URL


    ### Switching Between Production and Staging


    Most requests in the collection use `{{real-url}}` in their URL, for
    example:


    ```http

    POST {{real-url}}/rest/v2/createOrder

    ```


    To switch environments:


    1. **Set variable values**
       - In the collection or in an environment, set:
         - `real-url = https://api.tryoto.com`
         - `test-url = https://staging-api.tryoto.com`

    2. **Use staging during development**
       - Either temporarily change `real-url` to `https://staging-api.tryoto.com`, **or**
       - Duplicate a request and replace `{{real-url}}` with `{{test-url}}` when you want an explicit staging call.

    3. **Confirm the base URL in each request**
       - Some sample requests use the full URL directly (e.g., `https://api.tryoto.com/rest/v2/...`). You can optionally refactor them to use `{{real-url}}` / `{{test-url}}` for consistency.

    ---


    ## Collection Structure & Top‑Level Folders


    The collection is organized into folders by functional area so you can
    quickly find the endpoints relevant to each use case.


    ### Use Cases and Flows

    High‑level, guided workflows that show how to combine multiple endpoints to
    achieve real business flows (for example, onboarding, marketplace
    integration, or a full order‑to‑delivery journey). Start here if you want an
    opinionated step‑by‑step guide.


    ### Authorization

    Endpoints for authentication and connectivity such as refreshing tokens and
    checking API health. Use this folder to obtain/refresh access tokens and to
    verify that your credentials and base URLs are configured correctly.


    ### Account

    Account‑level endpoints such as **Account Info**, transaction history (e.g.,
    **Credit Transactions**), and other billing or credit‑related operations.
    Use this folder to understand your current account state, available balance,
    and transaction history.


    ### Marketplace

    Endpoints used when integrating OTO with external marketplaces or sales
    platforms. These calls usually handle registration, client information, and
    synchronization steps that connect your OTO account to third‑party channels.


    ### Orders

    Core order management endpoints, including **Create Order**, **Update
    Order**, **Update Order Status**, **Cancel Order**, **Get Orders**,
    **Hold/Unhold Order**, **Get Order Details**, and **Check Order
    Availability**. Use this folder to manage the full lifecycle of an order
    inside OTO before it becomes a shipment.


    ### Shipments

    Shipment‑focused endpoints such as **Create Shipment**, **Cancel Shipment**,
    shipment transaction history, and shipping price transaction queries. Use
    this folder once an order is ready to be shipped and you want to create or
    manage physical shipments.


    ### Return Shipments

    Endpoints to create and manage return logistics, including **Create Return
    Shipment**, **Get Return Link**, **Get Return Details**, and **Trigger
    Return SMS**. Use this folder when you need to initiate or track customer
    returns and reverse logistics flows.


    ### Shipping Label (AWB)

    Contains endpoints for generating or retrieving shipping labels (Air
    Waybills / AWBs), such as **Print AWB**. Use this folder when you need the
    label document to attach to a parcel.


    ### Tracking

    Tracking and history endpoints such as **Order Tracking**, **Order
    History**, and **Track Shipment**. Use this folder to fetch the latest
    status, full history, and live tracking information for orders and
    shipments.


    ### Carrier Integrations

    Endpoints related to available carriers and delivery options such as **Check
    OTO Delivery Fee**, **Check Delivery Fee**, **Get Delivery Fee**, **Get
    Delivery Estimation**, coverage checks, available cities and timeslots, DC
    list/config/activation, and delivery options. Use this folder to simulate
    shipping options, fees, and serviceability before creating shipments.


    ### Pickup Locations

    Endpoints for managing pickup locations / warehouses, including **Create
    Pickup Location**, **Update Pickup Location**, and **Get Pickup Location
    List**. Use this folder to configure and maintain where OTO should pick up
    your orders.


    ### Brands

    Endpoints for managing brands within your store, such as **Get List of
    Brands** and **Create Brand**. Use this folder if your integration
    differentiates inventory or products by brand.


    ### Sales Channels

    Endpoints that describe and configure sales channels (for example, **Sales
    Channels List**, **Sales Channel Config**, **Sales Channel Activation**).
    Use this folder to discover and manage how different sales channels are
    connected to your OTO account.


    ### Products

    Product catalog endpoints such as **Create Product**, **Product List**, and
    box‑related operations (add/update box, get box). Use this folder to
    synchronize your product master data with OTO, including SKU details and
    packaging information.


    ### Stock Management

    Inventory‑related endpoints such as **Update Stock Quantity**, **Check
    Inventory Stock**, **Check Global Stock**, **Create Inventory Order**, **Get
    Orders Ready For Packing**, and **Update Packing Status**. Use this folder
    to keep inventory levels in sync and to manage the packing stage before
    shipping.


    ### Webhook

    Endpoints to register, list, update, or delete webhooks for events like
    status updates. Use this folder to configure how OTO should notify your
    systems (e.g., when an order or shipment status changes), instead of polling
    the API.


    ### OTO FLEX

    Endpoints for **OTO FLEX**–specific operations such as **assignDriver**. Use
    this folder when working with flexible delivery models where you need to
    manage driver assignments directly.


    ### List Of Statuses

    Documentation of the different statuses used by the OTO platform across
    orders, shipments, and returns. Use this folder as a reference when mapping
    OTO statuses to your internal system’s status codes.


    ### Error Codes

    Documentation for error codes returned by the API and their meaning. Use
    this folder when handling error responses programmatically or when
    troubleshooting integration issues.


    ---


    ## Typical Integration Flow


    Below is a high‑level example of how to use this collection to build a basic
    integration:


    1. **Authenticate**
       - Use the **Authorization** (and/or **Marketplace**) folder to obtain your token.
       - Store the token in the collection or environment and verify it with **Health Check**.

    2. **Configure account & static data**
       - Review **Account** to confirm your account info and credits.
       - Set up **Pickup Locations**, **Brands**, **Products**, and **Sales Channels** as needed.

    3. **Manage stock & catalog**
       - Use **Products** and **Stock Management** to synchronize SKUs, packaging, and inventory levels from your system into OTO.

    4. **Create orders & shipments**
       - Create or sync orders using the **Orders** folder (e.g., **Create Order**).
       - When ready to ship, create shipments via the **Shipments** or **Carrier Integrations** folders.
       - Generate labels with **Shipping Label (AWB)**.

    5. **Track & update**
       - Track orders/shipments using **Tracking**.
       - Handle status updates via **Webhook** callbacks instead of polling.

    6. **Handle returns**
       - Use **Return Shipments** to create return flows, generate return links, and keep customers informed (e.g., via return SMS).

    ---


    ## Using This Collection in Postman


    1. **Set variables**  
       - Open the collection’s **Variables** tab and set `real-url` and `test-url` according to whether you are targeting production or staging.
       - Optionally add variables for authentication tokens and any IDs you reuse often (e.g., `pickup_location_id`, `sales_channel_id`).

    2. **Configure auth**  
       - In the collection’s **Authorization** tab, configure how the token should be sent (for example, Bearer Token) and reference your token variable. Inherit auth to all requests.

    3. **Run flows**  
       - Use the **Use Cases and Flows** folder and the Collection Runner to execute complete flows.
       - Use the other folders as reference while building your own automated flows or tests.

    For more detailed, endpoint‑level guidance, refer to each request’s
    description and the official OTO API documentation and guides linked from
    your OTO dashboard.
servers:
  - url: https://api.tryoto.com
paths:
  /rest/v2/refreshToken:
    post:
      summary: Refresh Token
      responses:
        '200':
          description: 200 OK
          headers:
            X-Cloud-Trace-Context:
              schema:
                type: string
              example: 5040bc2de0cdcc8f9bbaea8108d997f9;o=1
            Alt-Svc:
              schema:
                type: string
              example: clear
            Date:
              schema:
                type: string
              example: Tue, 21 Sep 2021 14:39:30 GMT
            Server:
              schema:
                type: string
              example: Google Frontend
            Content-Length:
              schema:
                type: integer
              example: '1207'
            Via:
              schema:
                type: string
              example: 1.1 google
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  success:
                    type: boolean
                  token_type:
                    type: string
                  expires_in:
                    type: string
                    format: utc-millisec
              example:
                access_token: _access_token_
                refresh_token: _refresh_token_
                success: true
                token_type: Bearer
                expires_in: '3600'
      tags:
        - Authorization
      security:
        - BasicAuth: []
      description: >-
        This API endpoint is used to obtain a new `access_token` by providing a
        valid `refresh_token`. The `access_token` is a temporary token with a
        lifespan of one hour, used to authenticate and authorize all subsequent
        API requests.


        Include the `access_token` in the request headers as:  

        `Authorization: Bearer access_token`


        To adhere to security standards, it is recommended to renew the
        `access_token` periodically (every hour) to maintain uninterrupted
        access to the API while minimizing security risks. This endpoint ensures
        seamless and secure token management for applications relying on API
        interactions.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | refresh_token | yes | string | `refresh_token` can obtain token from
        the UI, this is permanent token, use only to get `access_token` |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
            example:
              refresh_token: >-
                AMf-vBwIRQZypzlW7dH-4a-gXlW1zw3VLXwoTvnePZPT5V6AnSESwhk9h4DKRMbDGGaSbDrbF-Tui21wq5PCI33HS7RaAapIFmwziKjIAAfAI2TUY3Vz5fKSlUwKUUKjfB5GTsBnFGjR1zdq9dryhPK88utLrE1-DSbRjfgdy4NNG6RTxk2ST0BplDKOd
  /rest/v2/healthCheck:
    get:
      summary: Health Check
      responses:
        '200':
          description: 200 OK
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: >-
                Bearer
                realm="https://rest-api-gate-2zoj1r36.ew.gateway.dev/rest/v2/healthCheck"
            X-Cloud-Trace-Context:
              schema:
                type: string
              example: 73bb94d92619875946de4b001fb1cec2;o=1
            Date:
              schema:
                type: string
              example: Wed, 13 Oct 2021 12:06:25 GMT
            Server:
              schema:
                type: string
              example: Google Frontend
            Content-Length:
              schema:
                type: integer
              example: '40'
            Alt-Svc:
              schema:
                type: string
              example: clear
            Via:
              schema:
                type: string
              example: 1.1 google
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              example:
                status: ok
      tags:
        - Authorization
      description: |-
        **Available Packages:** All Packages

        This API endpoint is used to check if the system is working properly
  /rest/v2/accountInfo:
    get:
      summary: Account Info
      responses:
        default:
          description: '200'
      tags:
        - Account
      description: >-
        **Available Packages:** All Packages


        This API endpoint retrieves detailed information about the authenticated
        user's account. This includes general profile details, current
        subscription and balance of the account.


        **Note:** You can only see the account information that your token
        belongs to.


        **Response Body:**


        - name: full name of the account owner.
            
        - email: email address belong to the account.
            
        - mobile: mobile number belong to the account.
            
        - packageName: current subscription package name
            
        - remainingCredit: balance in account
            
        - remainingFreeShipments: number of free shipments offered in campaigns
  /rest/v2/buyCredit:
    post:
      summary: Buy Credit
      responses:
        default:
          description: '200'
      tags:
        - Account
      description: >-
        **Available Packages:** All Packages


        Provide amount of credit you wanted to buy, this will response a
        `paymentURL and paymentID`.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | amount | yes | number | the amount of credit wanted to buy |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
            example:
              amount: 13.5
  /rest/v2/creditTransactions:
    get:
      summary: Credit Transactions
      parameters:
        - name: perPage
          in: query
          schema:
            type: integer
          example: '50'
        - name: page
          in: query
          schema:
            type: integer
          example: '1'
        - name: minDate
          in: query
          schema:
            type: string
          example: '2022-01-01'
        - name: maxDate
          in: query
          schema:
            type: string
          example: '2024-06-10'
        - name: orderId
          in: query
          schema:
            type: integer
          example: '3078872'
        - name: x-forwarded-authorization
          in: header
          schema:
            type: string
          example: Bearer {{token}}
      responses:
        '200':
          description: 200 OK
          headers:
            Date:
              schema:
                type: string
              example: Tue, 02 Jul 2024 11:20:38 GMT
            Content-Length:
              schema:
                type: integer
              example: '7878'
            Server:
              schema:
                type: string
              example: Jetty(9.4.3.v20170317)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: integer
                        orderID:
                          type: string
                          format: utc-millisec
                        deliveryCompanySettingsId:
                          type: integer
                        description:
                          type: string
                        transactionDate:
                          type: string
                          format: style
                        orderPaymentType:
                          type: string
                        shipmentType:
                          type: string
                        transactionType:
                          type: string
                        remainingAmount:
                          type: number
                        deliveryCompanyName:
                          type: string
                        chargingType:
                          type: string
                        langKey:
                          type: string
                        shipmentID:
                          type: string
                        ID:
                          type: integer
                        otoOrderID:
                          type: integer
                        status:
                          type: string
              example:
                success: true
                transactions:
                  - amount: 19
                    orderID: '41590739'
                    deliveryCompanySettingsId: 5564
                    description: >-
                      Shipment canceled. Delivery fees will be credited back to
                      your account.
                    transactionDate: '2024-09-16T11:26:01'
                    orderPaymentType: cod
                    shipmentType: forward
                    transactionType: dcFee
                    remainingAmount: 85.9
                    deliveryCompanyName: Deliver Now
                    chargingType: charge
                    langKey: dcFeeShipmentCanceledRevokedDescription
                    shipmentID: DNL05000049328
                    ID: 8294185
                    otoOrderID: 10690509
                    status: revoked
                  - amount: 18
                    orderID: OID-20980-1092
                    deliveryCompanySettingsId: 5551
                    description: >-
                      Canceled shipment. Delivery fee credited back to your
                      account.
                    transactionDate: '2024-09-24T10:40:43'
                    orderPaymentType: paid
                    shipmentType: forward
                    transactionType: dcFee
                    remainingAmount: 51.8
                    deliveryCompanyName: Aramex
                    chargingType: refund
                    langKey: dcFeeShipmentCanceledDescription
                    shipmentID: '50162082692'
                    ID: 8430556
                    otoOrderID: 10748485
                    status: canceled
                  - amount: 0.9
                    orderID: '1203'
                    deliveryCompanySettingsId: 3022
                    description: OTO Fee Booked on shipment created
                    transactionDate: '2024-09-01T11:37:10'
                    orderPaymentType: cod
                    transactionType: otoFee
                    remainingAmount: 111.2
                    deliveryCompanyName: OTO FLEX
                    langKey: otoFeeSearchingDriverDescription
                    shipmentID: '0e073859'
                    ID: 8057956
                    otoOrderID: 10248079
                    status: booked
        '400':
          description: 400 Invalid Date
          headers:
            Date:
              schema:
                type: string
              example: Tue, 02 Jul 2024 11:06:28 GMT
            Content-Length:
              schema:
                type: integer
              example: '63'
            Server:
              schema:
                type: string
              example: Jetty(9.4.3.v20170317)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  otoErrorCode:
                    type: string
                    format: utc-millisec
                  otoErrorMessage:
                    type: string
              example:
                success: false
                otoErrorCode: '1107'
                otoErrorMessage: minDate or maxDate is missing or invalid
      tags:
        - Account
      description: >-
        **Available Packages**: Starter Package, Scale Package, Enterprise
        Package, Marketplaces


        This API endpoint provides a powerful way to retrieve credit transaction
        records from your system. This endpoint supports pagination for
        efficient data retrieval and allows filtering based on minimum and
        maximum dates. Additionally, if an `orderId` is provided, the `maxDate`
        and `minDate` parameters become optional, enabling direct access to
        transactions associated with the specified order.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | perPage | yes | number | Credit transaction count in the response. Max
        limit 100 |

        | page | yes | number | Pagination number. You can iterate this field to
        get all items. |

        | minDate | yes (If there is no orderId) | date | Starting "Transaction
        Date" of your credit transactions in "yyyy-mm-dd" format. |

        | maxDate | yes (If there is no orderId) | date | Ending "Transaction
        Date" of your credit transactions in "yyyy-mm-dd" format. |

        | orderId | no | string | Order ID for transactions of a single Order |


        #### Response Body


        The response will include a `success` flag indicating the status of the
        request, and an `orders` array containing transaction details. Each
        transaction object in the `orders` array includes the following
        properties:


        - `transactionType` (string) - Type of the transaction.
            
        - `remainingAmount` (number) - The remaining amount for the transaction.
            
        - `amount` (number) - The transaction amount.
            
        - `deliveryCompanyName` (string) - Name of the delivery company.
            
        - `orderID` (string) - ID of the order.
            
        - `shipmentID` (string) - ID of the shipment.
            
        - `description` (string) - Description of the transaction.
            
        - `ID` (number) - Unique ID of the transaction.
            
        - `transactionDate` (string) - Date of the transaction.
            
        - `otoOrderID` (number) - OTO (One-Time-Only) order ID.
            
        - `orderPaymentType` (string) - Payment type for the order.
            
        - `status` (string) - Status of the transaction.
            
        - `chargeType`(string) -Type of the charge(charge, additionalCharge,
        refund, partialRefund)
            
        - `shipmentType`(string)-Type of the shipment(forward, return, reverse)
            

        In case of an empty result, the `orders` array will be empty with a
        `success` flag set to true.
  /rest/v2/register:
    post:
      summary: Register
      responses:
        '200':
          description: 200 OK
          headers:
            X-Cloud-Trace-Context:
              schema:
                type: string
              example: 1fbf1412d64e3a4ac3ee0f4b5c6ab666;o=1
            Alt-Svc:
              schema:
                type: string
              example: clear
            Date:
              schema:
                type: string
              example: Tue, 12 Oct 2021 15:02:07 GMT
            Server:
              schema:
                type: string
              example: Google Frontend
            Content-Length:
              schema:
                type: integer
              example: '420'
            Via:
              schema:
                type: string
              example: 1.1 google
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  activationLink:
                    type: string
                    format: uri
                  refreshToken:
                    type: string
              example:
                success: true
                activationLink: https://login.tryoto.com/XYZ
                refreshToken: _refreshToken_
      tags:
        - Marketplace
      description: >-
        **Available Packages:** Marketplaces


        This API endpoint is just for **marketplaces with multiple vendors**.
        Marketplaces can register their vendors to OTO with this endpoint. It
        requires a **special kind of token** provided by OTO. Regular refresh
        tokens will **not** work here.


        If you are a market place you can use register endpoint to create an OTO
        account for your vendors.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | companyName | yes | string | Company name of your vendor |

        | email | yes | string | Email of your vendor.(e.g.,
        [test@example.com](https://mailto:test@example.com)) |

        | fullName | yes | string | Full name of your vendor |

        | mobileNumber | yes | string | Mobile number of your vendor |

        | crNumber | no | string | CR number of your vendor |

        | vatNumber | no | string | Vat number of your vendor |

        | billingAddress | no | string | Billing address of your vendor |

        | companyLogoURL | no | string | Company logo URL of your vendor |

        | webhookURL | no | string | Webhook URL of your vendor |

        | webhookMethod | no | string | `POST`,`GET` |

        | webhookSecretKey | no | string | Webhook secret key of your vendor |

        | currency | no | string | ISO 4217 three-letter code: SAR, USD |
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: "{\r\n    \"mobileNumber\":\"966559665498\",\r\n\_ \_ \"fullName\":\"test vendor\",\r\n\_ \_ \"email\":\"test987654@example.com\",\r\n    \"companyName\":\"test company 987654\"}"
  /rest/v2/clientInfo:
    post:
      summary: Client Info
      responses:
        '200':
          description: 200 OK
          headers:
            X-Cloud-Trace-Context:
              schema:
                type: string
              example: 3c813ceaf2dbd0d9763206c5d247a06c;o=1
            Alt-Svc:
              schema:
                type: string
              example: clear
            Date:
              schema:
                type: string
              example: Tue, 21 Sep 2021 15:34:05 GMT
            Server:
              schema:
                type: string
              example: Google Frontend
            Content-Length:
              schema:
                type: integer
              example: '6925'
            Via:
              schema:
                type: string
              example: 1.1 google
          content:
            application/json:
              schema:
                type: object
                properties:
                  userActivated:
                    type: string
                  remainingCredit:
                    type: integer
                  validityDate:
                    type: string
                  success:
                    type: boolean
                  refreshToken:
                    type: string
              example:
                userActivated: 'false'
                remainingCredit: 0
                validityDate: 13-October-2028
                success: true
                refreshToken: _refreshToken_
      tags:
        - Marketplace
      description: >-
        **Available Packages:** Marketplaces


        This API endpoint is just for marketplaces. Marketplaces can register
        their vendors to OTO with a special kind of token provided by OTO.
        Regular refresh tokens will not work here.


        If you are a marketplace and used register endpoint to create an OTO
        account for your vendors , you can get the information about the client
        you have registered.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | email | yes | string | registered email of client |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
