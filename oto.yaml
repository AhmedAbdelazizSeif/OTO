      tags:
        - Orders
      description: >-
        **Available Packages:** All Packages


        This API endpoint is a critical component in e-commerce and logistics
        systems, enabling external applications to initiate and manage new
        orders seamlessly. This endpoint allows you to submit order details,
        such as customer information, product data, shipping preferences, and
        payment methods.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | orderId | yes | string | Id of the Order |

        | parentOrderId | no | string | parent id of splitted orders. |

        | entityId | no | number | Identifier of the entity (e.g., sales
        channels) linked to the order. |

        | ref1 | no | string | Reference for order optional |

        | pickupLocationCode | no | string | predefined pickup address of
        stores/warehouses, if it doesn't exist then OTO will assign it to a
        pickup location automatically. it is required when `serviceType` is
        filled `pickupFromStore` |

        | createShipment | no | boolean | if you fill it `true` then automatic
        shipment will be created for this order. |

        | serviceType | no | string | `pickupFromStore` this is optional for
        orders customer pick it up from store. |

        | forReverseShipment | no | boolean | if it is true, order can be
        reverse shipped without forward shipment |

        | deliveryOptionId | no | string | activated delivery company option id,
        if this exists OTO try to create shipment with this settings. if not
        exists try with possible active settings. |

        | storeName | no | string | Name of the store |

        | pickingType | no | enum | Possible values:  <br>PICKUP_BY_DC: Shipping
        company offers free pickup from origin. BRANCH_DROP_OFF: Package must be
        delivered to a branch of the shipping company. |

        | payment_method | yes | string | Possible values: - _cod_ - _paid_ |

        | amount | yes | double | Total value amount of the order |

        | amount_due | yes | double | Total due amount of the order. If order
        paid amount_due will be 0. Otherwise equal to amount. |

        | currency | yes | string | Currency code of the order currency |

        | shippingAmount | no | double | shipping amount of this order |

        | subtotal | no | double | Subtotal of the order |

        | shippingNotes | no | string | Notes of customer for shipping. I.e
        `don’t ring the bell.` |

        | packageSize | no | string | Used for specifiying the maximum package
        size. Possible values smalbox |

        | packageCount | no | integer | States how many package in the order |

        | packageWeight | no | double | Total weight of the order(kg) |

        | boxWidth | conditional | double | width of the package, it is needed
        to use Aggregator shipping options |

        | boxLength | conditional | double | length of the package, it is needed
        to use Aggregator shipping options |

        | boxHeight | conditional | double | height of the package, it is needed
        to use Aggregator shipping options |

        | deliverySlotDate | no | date | Prefered `Delivery` date |

        | deliverySlotFrom | no | string | “From” time for delivery time |

        | deliverySlotTo | no | string | “To” time for delivery time |

        | orderDate | no | dateTime | Date of the order |

        | senderName | no | string | Sender name |

        | senderInformation | no | object | Sender Data |

        | customer | yes | object | Customer Data |

        | items | yes | array | Items data |

        | couponCode | no | text | Discount or special offer code. |

        | codFee | no | double | COD Fee |

        | brandId | no | long | Brand (Client Store) ID |

        | whoPays | no | string | If implemented, annotates who wil pay for the
        shipment. Possible values: marketplacePaysDeliveryFee,
        sellerPaysDeliveryFee |

        | frontSideIDCard | no | string | URL of the front side of the
        recipient’s national ID card. Required for international shipments to
        Kuwait, Oman and Qatar. |

        | backSideIDCard | no | string | URL of the back side of the recipient’s
        national ID card. Required for international shipments to Kuwait, Oman
        and Qatar. |


        **Request Parameters for Sender Information Data**


        | **Name** | **Required** | **Type** | **Description** |

        | --- | --- | --- | --- |

        | senderAddressName | no | string | Name of the sender address |

        | senderId | yes | string | Id of the sender |

        | senderFullName | yes | string | Full name of the sender |

        | senderMobile | yes | string | Mobile number of sender |

        | senderEmail | no | string | In format of
        [test@example.com](https://mailto:test@example.com) |

        | senderCountry | yes | string | Country ISO2 code "SA","AE" etc. |

        | senderShortAddressCode | no | string | The short address code in the
        national address. |

        | senderBuildingNo | no | string | The building number from the national
        address. |

        | sendersecondaryAddressNumber | no | string | The additional/secondary
        number in the national address. |

        | senderState | no | string | State name of the sender |

        | senderCity | yes | string | City name of the sender |

        | senderDistrict | no | string | District name of the sender |

        | senderStreet | no | string | Street name of the sender |

        | senderPostcode | no | string | Postal code of the sender's address |

        | senderAddressLine | yes | string | Detailed address of the sender |

        | lat | no | number | Latitude, \*if not exist orders may not assigned
        to pickupLocations automatically |

        | lon | no | number | Longitude, \* if not exist orders may not assigned
        to pickupLocations automatically |


        **Request Parameters for Customer Data**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | name | yes | string | Customer full name |

        | email | no | string | Customer email address |

        | mobile | yes | string | Mobile number of the customer |

        | address | yes | string | Address of the customer |

        | district | no | string | District or area name |

        | city | yes | string | City name |

        | state | no | string | State name |

        | country | yes | string | Possible values can be
        _SA_,_EG_,_UAE_,_BHR_,_KWT_ |

        | buildingNo | no | string | The building number from the national
        address. |

        | secondaryAddressNumber | no | string | The additional/secondary number
        in the national address. |

        | shortAddressCode | no | string | A simplified version of the
        traditional address transformed into a unique code. It consists of 4
        letters (e.g., RAGI) assigned based on postal codes and 4 digits
        representing the building number (e.g., 2929). |

        | postcode | no | string | postal code of address |

        | street | no | string | Street of the customer |

        | lat | no | double | Latitude |

        | lon | no | double | Longitude |

        | refID | no | string | exp. customerId of ecommerce |

        | W3WAddress | no | string | if you want to define the address with
        using [what3words.com](https://what3words.com/clear.clear.clear) you can
        use this option |


        **Request Parameters for Items Data**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | productId | no | long | Id of the product |

        | name | yes | string | Name of the product |

        | price | yes | double | Unit price of the product |

        | rowTotal | no | double | total amount of this line item |

        | taxAmount | no | double | tax amount of this line item |

        | quantity | yes | double | Quantity purchased |

        | serialnumber | no | string | Serial number of the product |

        | sku | yes | string | SKU number of the product |

        | image | no | string | Http link of the product main photo |

        | hsCode | conditional | string | a standardized numerical method of
        classifying traded products- required for International shipments. |

        | itemOrigin | no | string | Origin of the item |
