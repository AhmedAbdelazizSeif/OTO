    post:
      summary: Check Order Availability
      responses:
        '200':
          description: 200 OK
          headers:
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
            X-XSS-Protection:
              schema:
                type: integer
              example: '0'
            Cache-Control:
              schema:
                type: string
              example: no-cache, no-store, max-age=0, must-revalidate
            Pragma:
              schema:
                type: string
              example: no-cache
            Expires:
              schema:
                type: integer
              example: '0'
            X-Frame-Options:
              schema:
                type: string
              example: DENY
            Content-Length:
              schema:
                type: integer
              example: '193'
            Date:
              schema:
                type: string
              example: Thu, 14 Aug 2025 09:27:16 GMT
            Keep-Alive:
              schema:
                type: string
              example: timeout=60
            Connection:
              schema:
                type: string
              example: keep-alive
        '404':
          description: 404 not found
          headers:
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
            X-XSS-Protection:
              schema:
                type: integer
              example: '0'
            Cache-Control:
              schema:
                type: string
              example: no-cache, no-store, max-age=0, must-revalidate
            Pragma:
              schema:
                type: string
              example: no-cache
            Expires:
              schema:
                type: integer
              example: '0'
            X-Frame-Options:
              schema:
                type: string
              example: DENY
            Content-Length:
              schema:
                type: integer
              example: '42'
            Date:
              schema:
                type: string
              example: Thu, 14 Aug 2025 09:28:01 GMT
            Keep-Alive:
              schema:
                type: string
              example: timeout=60
            Connection:
              schema:
                type: string
              example: keep-alive
      tags:
        - Orders
      description: >-
        ## Check Order Availability


        This API endpoint allows you to check the availability of an order based
        on the provided `orderId` and associated `ruleIds`.


        ### Request Method


        **POST**


        ### Endpoint


        `{{real-url}}/rest/v2/checkOrderAvailability`


        ### Request Parameters


        1. **Existing Order (with OrderID)**
            
            - The user provides an orderId (increment ID) that is already created in OTO.
                
            - The system checks the availability of the order and returns the list of locations where it can be fulfilled.
                
            - By default, the API considers all OMS rules while checking availability.
                
            - Optionally, the user can provide specific OMS ruleIds, and the system will use these rules instead of the default set.
                
            
        2. **Draft Order (without OrderID)**
            
            - The user provides all required order and customer details for an order that has not yet been created in OTO.
                
            - The system checks the availability based on the provided information and returns the list of locations where the order can be fulfilled.
                
            - By default, the API considers all OMS rules while checking availability.
                
            - Optionally, the user can provide specific OMS ruleIds, and the system will use these rules instead of the default set.
                
            

        #### Example Request Body


        ``` json

        {
            "orderId": "extra-test-10",
            "ruleIds": [
                "b781d9e6-36da-4cd1-bf7d-f8604561ca6a"
            ]
        }

         ```

        ### Expected Response Format


        The response will be in JSON format and will include the following
        fields:


        - **success** (boolean): Indicates whether the request was successful.
            
        - **locations** (array of objects): Contains details about the locations
        related to the order availability. Each location object includes:
            
            - **locationName** (string): The name of the location.
                
            - **distance** (number): The distance to the location.
                
            - **locationCoordinates** (object): Contains the coordinates of the location with:
                
                - **lon** (number): Longitude of the location.
                    
                - **lat** (number): Latitude of the location.
                    
            - **locationCode** (string): The code for the location.
                
        - **orderAvailability** (string): A string indicating the availability
        status of the order.
            

        #### Example Response


        ``` json

        {
            "success": true,
            "locations": [
                {
                    "locationName": "",
                    "distance": 0,
                    "locationCoordinates": {
                        "lon": 0,
                        "lat": 0
                    },
                    "locationCode": ""
                }
            ],
            "orderAvailability": ""
        }

         ```
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                ruleIds:
                  type: array
                  items:
                    type: string
            example:
              orderId: extra-test-10
              ruleIds:
                - b781d9e6-36da-4cd1-bf7d-f8604561ca6a
