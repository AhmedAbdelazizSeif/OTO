  /rest/v2/createPickupLocation:
    post:
      summary: Create Pickup Location
      responses:
        '200':
          description: 200 warehouse
          headers:
            X-Cloud-Trace-Context:
              schema:
                type: string
              example: 670ef00be5ba7a8b959e8e6c913be189;o=1
            Alt-Svc:
              schema:
                type: string
              example: clear
            Date:
              schema:
                type: string
              example: Tue, 02 Nov 2021 14:19:10 GMT
            Server:
              schema:
                type: string
              example: Google Frontend
            Content-Length:
              schema:
                type: integer
              example: '71'
            Via:
              schema:
                type: string
              example: 1.1 google
          content:
            application/json:
              schema:
                type: object
                properties:
                  warhouseId:
                    type: string
                    format: color
                  pickupLocationCode:
                    type: string
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                warhouseId: '123'
                pickupLocationCode: code-01
                success: true
                message: warhouse has been created
      tags:
        - Pickup Locations
      description: >-
        **Available Packages:** All Packages


        This API endpoint allows you to define and register a new pickup
        location within the system. By specifying the location details, you can
        expand your network of pickup points, improving logistics and delivery
        workflows.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | name | yes | string | Name of the pickup location |

        | type | no | string | You can enter these values: `branch`,
        `warehouse`.  <br>Branch can only be used by enterprise and marketplace
        packages |

        | code | yes | string | Code of the pickup location |

        | mobile | yes | string | Mobile number of the pickup location |

        | lat | no | number | Latitude, \*if not exist orders may not assigned
        to pickupLocations automatically |

        | lon | no | number | Longitude, \* if not exist orders may not assigned
        to pickupLocations automatically |

        | city | yes | string | City name of the pickup location |

        | country | yes | string | Country ISO2 code "SA","AE" etc. |

        | postcode | no | string | Postal code of the pickup location |

        | address | yes | string | Address of the pickup location |

        | district | no | string | The district or area where the location is
        situated |

        | state | no | string | The state or province where the pickup location
        is located |

        | street | no | string | The street address of the pickup location |

        | shortAddressCode | no | string | The short address code in the
        national address |

        | secondaryAddressNumber | no | string | The additional/secondary number
        in the national address |

        | buildingNo | no | string | The building number from the national
        address |

        | contactName | yes | string | If not exists you may not create
        shipments with some delivery companies |

        | contactEmail | yes | string | In format of
        [test@example.com](https://) |

        | servingRadius | no | number | Serving radius of branch in KM |

        | brandName | no | string | Store brand name which this location belongs
        to. |

        | status | no | string | Status of the pickup location(active, inactive)
        |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                code:
                  type: string
                name:
                  type: string
                mobile:
                  type: string
                  format: utc-millisec
                address:
                  type: string
                contactName:
                  type: string
                contactEmail:
                  type: string
                lat:
                  type: string
                lon:
                  type: string
                city:
                  type: string
                country:
                  type: string
                street:
                  type: string
                district:
                  type: string
                buildingNo:
                  type: string
                  format: utc-millisec
                secondaryAddressNumber:
                  type: string
                  format: utc-millisec
                postcode:
                  type: string
                  format: utc-millisec
                servingRadius:
                  type: string
                  format: utc-millisec
                shortAddressCode:
                  type: string
                brandName:
                  type: string
            example:
              type: branch
              code: code-0211112
              name: Location-02 Name11111
              mobile: '555888777'
              address: >-
                3474, Abi Almahd, 7026, Al Olaya, 12221, Riyadh, Kingdom of
                Saudi Arabia
              contactName: Test Contact
              contactEmail: Test Email
              lat: '26.001'
              lon: '50.001'
              city: Dammam
              country: SA
              street: Abi Almahd
              district: Al Olaya
              buildingNo: '3474'
              secondaryAddressNumber: '7026'
              postcode: '12221'
              servingRadius: '10'
              shortAddressCode: RHOD3474
              brandName: Example Seller
