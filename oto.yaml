      tags:
        - Carrier Integrations
      description: >-
        **Available Packages**: All Packages


        This API endpoint calculates shipping prices offered by OTO rates. By
        providing the origin city, destination city, and package details (such
        as weight and dimensions), the API computes the price based on the
        provided request parameters.


        ##### Important Note:


        - The prices returned by this API are applicable only to shipping
        options available under OTO's contracts.
            
        - To calculate prices for your own custom contracts, please use the
        Check Delivery Fee API.
            
        - You can see the shipping prices of delivery companies regarding to
        your account's country information.
            

        ##### Pricing Calculation Details:


        - The price is determined based on the greater value between the actual
        weight and the volumetric weight of the package.
            
        - Be sure to include the larger of these two values in your request.
            

        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | originCity | yes | string | pickup city |

        | destinationCity | yes | string | destination city |

        | originLat | no | number | reqired for `bullet` type |

        | originLon | no | number | reqired for `bullet` type |

        | destinationLat | no | number | reqired for `bullet` type |

        | destinationLon | no | number | reqired for `bullet` type |

        | weight\* | yes | number | approximate weight of package(kg) |

        | forReverseShipment | no | boolean | When you set is true, it will list
        the delivery companies that you can create reverse shipments. |

        | currency | no | string | ISO 4217 code, "SAR","KWD", etc |

        | packageCount | no | number | 1 |

        | totalDue | no | number | cash on delivery amount |

        | length | no | number | length of the package(cm) |

        | width | no | number | width of the package(cm) |

        | height | no | number | height of the package(cm) |

        | serviceType | no | enum | `express`,`sameDay`, `fastDelivery`,
        `coldDelivery`,`heavyAndBulky`, `electronicAndHeavy` |

        | deliveryType | no | enum | `toCustomerDoorstep pickupByCustomer
        toCustomerDoorstepOrPickupByCustomer` |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                weight:
                  type: string
                  format: utc-millisec
                originCity:
                  type: string
                destinationCity:
                  type: string
                height:
                  type: integer
                width:
                  type: integer
                length:
                  type: integer
            example:
              weight: '3'
              originCity: Riyadh
              destinationCity: Jeddah
              height: 30
              width: 30
              length: 30
