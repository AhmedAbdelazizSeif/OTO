        This API endpoint provides an overview of total stock availability for
        SKUs across all locations. This endpoint aggregates stock levels to
        display a global view, helping businesses understand their overall
        inventory status.


        **Request Parameters:**


        | Name | Required | Type | **Description** |

        | --- | --- | --- | --- |

        | sku | yes | string | The product's SKU identifier |


        **Response:**


        - **success**: Indicates whether the request was successful (`true` or
        `false`).
            
        - **stock**: A dictionary with SKUs as keys, containing global stock
        details for each product:
            
            - **sku**: The product's unique SKU identifier.
                
            - **quantityOnHand**: The total quantity of the product available across all locations.
                
            - **quantityForecasted**: The total forecasted stock quantity, if applicable.
                
            - **minInventory**: The minimum inventory threshold for the product, if defined.
  /rest/v2/createInventoryOrder:
    post:
      summary: Create Inventory Order
      responses:
        '200':
          description: '200'
          headers:
            Date:
              schema:
                type: string
              example: Wed, 08 Nov 2023 08:23:07 GMT
            Content-Length:
              schema:
                type: integer
              example: '29'
            Server:
              schema:
                type: string
              example: Jetty(9.4.3.v20170317)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  otoId:
                    type: integer
              example:
                success: true
                otoId: 4026
        '400':
          description: 400 wrong location code
          headers:
            Date:
              schema:
                type: string
              example: Thu, 09 Nov 2023 07:41:55 GMT
            Content-Length:
              schema:
                type: integer
              example: '107'
            Server:
              schema:
                type: string
              example: Jetty(9.4.3.v20170317)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  otoErrorCode:
                    type: string
                  otoErrorMessage:
                    type: string
              example:
                success: false
                otoErrorCode: OTO1133
                otoErrorMessage: Location Code is missing or invalid
      tags:
        - Stock Management
      description: >-
        **Available Packages:** Scale Package, Enterprise Package, Marketplaces


        This API endpoint creates inventory order as inbound or outbound for a
        warehouse or branch location. This API is used mostly to provide the
        incoming or outgoing bulk items from ERP systems to OTO. Once the order
        is created the status will be new for the warehouse or branch to accept
        and process the order.


        **Request Parameters:**


        | Name | Required | Type | **Description** |

        | --- | --- | --- | --- |

        | action | yes | enum | "inbound": Creates the order as purchase type
        and sets the ingoing location field  <br>"outbound": Creates the order
        as disposal and sets the outgoing location field |

        | locationCode | yes | string | Code of the warehouse or the branch of
        the inventory |

        | binLocationName | no | string | Name of the desired Bin |

        | orderDate | no | date | Date of the order, must be a valid date value
        |

        | deliveryDate | no | date | Date of the delivery, must be a valid date
        value |

        | waybillNumber | no | string | WayBillNumber of the order |

        | description | no | string | Arbitrary description of the order |

        | items | no | JSONArray | An array of the items of the order |


        **Request paramaters for Items array:**


        | **Name** | **Required** | **Type** | **Description** |

        | --- | --- | --- | --- |

        | sku | yes | string | SKU of the item of the customer that exists on
        database |

        | qty | yes | integer | Quantity of the item, must be a positive number
        |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                locationCode:
                  type: string
                binLocationName:
                  type: string
                orderDate:
                  type: string
                deliveryDate:
                  type: string
                waybillNumber:
                  type: string
                  format: utc-millisec
                description:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      sku:
                        type: string
                        format: color
                      qty:
                        type: string
                        format: utc-millisec
            example:
              action: inbound
              locationCode: WHA
              binLocationName: test
              orderDate: 31/03/2022
              deliveryDate: 31/03/2023
              waybillNumber: '12345'
              description: loc1
              items:
