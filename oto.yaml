        Package, Marketplaces


        This endpoint enables OTO to send update payloads to the specified URL
        using the defined method. Optional security measures, such as token
        authentication and payload validation, can be configured for enhanced
        security.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | method | yes | string | `POST` or `PUT` |

        | url | yes | string | Your endpoint listens to get OTO webhook payload,
        when order status changes.
        exp.`https://webhook.site/3e53c98a-a089-4ca4-9bc4-df10e5a71e4b` |

        | secretKey | no | string | With this key message is signed and receiver
        validate. |

        | authorizationKey | no | string | Secure token used to authenticate and
        validate incoming webhook requests. |

        | timestampFormat | no | string | Exp "yyyy-MM-dd HH:mm:ss" format
        receiver want to get. |

        | orderPrefix | no | string | If orders has prefix in OTO, then put
        prefix string to be removed before webhook body prepared. |

        | webhookType | no | string | `shipmentError`, sends create shipment
        error messages; `orderStatus` sends order status changes. default is
        `orderStatus and newOrders` webhook is used to create orders in a
        different WMS. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                url:
                  type: string
                  format: uri
                orderPrefix:
                  type: string
                timestampFormat:
                  type: string
                  format: style
                secretKey:
                  type: string
                authorizationKey:
                  type: string
                webhookType:
                  type: string
            example:
              method: post
              url: https://webhook.site/3e53c98a-a089-4ca4-9bc4-df10e5a71e4b
              orderPrefix: fulfillment
              timestampFormat: '2025-01-01 13:14:34'
              secretKey: key1234
              authorizationKey: authorizationkey123
              webhookType: shipmentError
    get:
      summary: webhook
      responses:
        '200':
          description: '200'
          headers:
            X-Cloud-Trace-Context:
              schema:
                type: string
              example: 5ae767cdbb3cacc38c0de4dee7bc72b6
            Alt-Svc:
              schema:
                type: string
              example: h3=":443"; ma=2592000,h3-29=":443"; ma=2592000
