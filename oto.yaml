  /rest/v2/getDeliveryEstimation:
    post:
      summary: Get Delivery Estimation
      parameters:
        - name: sec-ch-ua
          in: header
          schema:
            type: string
          example: '"Google Chrome";v="119", "Chromium";v="119", "Not?A_Brand";v="24"'
        - name: sec-ch-ua-mobile
          in: header
          schema:
            type: string
          example: '?0'
        - name: User-Agent
          in: header
          schema:
            type: string
          example: >-
            Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
            like Gecko) Chrome/119.0.0.0 Safari/537.36
        - name: Referer
          in: header
          schema:
            type: string
          example: https://qa.tryoto.com/price-calculator
        - name: sec-ch-ua-platform
          in: header
          schema:
            type: string
          example: '"Windows"'
      responses:
        '200':
          description: '200'
          headers:
            X-Cloud-Trace-Context:
              schema:
                type: string
              example: c2b0f154a650504a9f5a81a1772748be
            Alt-Svc:
              schema:
                type: string
              example: h3=":443"; ma=2592000,h3-29=":443"; ma=2592000
            Date:
              schema:
                type: string
              example: Wed, 10 Jan 2024 14:45:30 GMT
            Server:
              schema:
                type: string
              example: Google Frontend
            Content-Length:
              schema:
                type: integer
              example: '419'
            Via:
              schema:
                type: string
              example: 1.1 google
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        estimatedTransferDuration:
                          type: integer
                        shippingContract:
                          type: object
                          properties:
                            agreementType:
                              type: string
                            deliveryCompanySettingsId:
                              type: integer
                            name:
                              type: string
                            id:
                              type: integer
                            slaMethodType:
                              type: string
                            deliveryIntegrationName:
                              type: string
                        estimatedPickupDate:
                          type: string
                          format: date
                        cutOffSameDayPickup:
                          type: string
                          format: style
                        estimatedTransferCompletionDate:
                          type: string
                          format: date
                        estimatedDeliveryDate:
                          type: string
                          format: date
                        shipmentCreateDate:
                          type: string
                          format: date
                  success:
                    type: boolean
              example:
                result:
                  - estimatedTransferDuration: 3
                    shippingContract:
                      agreementType: INTEGRATOR
                      deliveryCompanySettingsId: 1233
                      name: Smsa Ecom V2
                      id: 117
                      slaMethodType: TIER_BASED
                      deliveryIntegrationName: secom
                    estimatedPickupDate: '2024-01-15'
                    cutOffSameDayPickup: '15:00'
                    estimatedTransferCompletionDate: '2024-01-18'
                    estimatedDeliveryDate: '2024-01-18'
                    shipmentCreateDate: '2024-01-10'
                success: true
        default:
          description: BULLET_DISTRICT
      tags:
        - Carrier Integrations
      description: >-
        **Available Packages:** Scale Package, Enterprise Package, Marketplaces


        This API endpoint allows you to access estimated delivery dates, times,
        and other last-mile process details by utilizing the SLA configurations
        of your shipping partners. By providing key information such as the
        pickup and customer addresses, you can retrieve precise delivery and
        pickup date estimates. This capability enhances the accuracy of your
        shipping operations and proves invaluable for businesses and logistics
        providers aiming to streamline workflows and deliver reliable delivery
        timelines to their customers.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | calculationData | yes | JSONObject | Attributes will be used to
        calculate estimations |

        | deliveryCompanySettingsId | no | number | To ask for specific contract
        |

        | slaMethodType | no | enum | To filter contracts based on the SLA
        Calculation Method. Enum list:
        \["BULLET_KM","CITY_BASED","DISTRICT_BASED","KM_BASED","TIER_BASED"\] |


        **Request Paramaters: originAddress and destinationAddress**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | city | yes | string | Pickup city and destination city separately |

        | country | yes | string | Pickup country and destination country
        separately |

        | lat | no | number | Reqired for bullet type |

        | lon | no | number | Reqired for bullet type |

        | district | no | number | Reqired for dtistrict based sla |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                calculationData:
                  type: object
                  properties:
                    originAddress:
                      type: object
                      properties:
                        city:
                          type: string
                        country:
                          type: string
                        lat:
                          type: integer
                        lon:
                          type: integer
                        district:
                          type: string
                    destinationAddress:
                      type: object
                      properties:
                        city:
                          type: string
                        country:
                          type: string
                        lat:
                          type: integer
                        lon:
                          type: integer
                        district:
                          type: string
                deliveryCompanySettingsId:
                  type: integer
                slaMethodType:
                  type: string
            example:
              calculationData:
                originAddress:
                  city: Riyadh
                  country: SA
                  lat: 45
                  lon: 45
                  district: ''
                destinationAddress:
                  city: Riyadh
                  country: SA
                  lat: 45
                  lon: 45
                  district: ''
              deliveryCompanySettingsId: 1233
              slaMethodType: CITY_BASED
