                success: true
      tags:
        - Return Shipments
      description: >-
        **Available Packages:** All Packages


        This API endpoint allows you create reverse shipment for delivered
        orders, while creating shipments need a valid delivery option id. You
        can get valid delivery options in two ways:


        - **Delivery Options with OTO rates**:  
            No contracted delivery companies or activation is required. OTO offers a range of delivery company options, which are available for use. You can view these options and their associated fees by using the `Check OTO Delivery Fee` endpoint.
            
        - **Delivery Options with your own rates:**  
            In this case, you already have agreements with one or more delivery companies. Each delivery company you connect is linked to a specific delivery option ID. You can retrieve these IDs by using the `Get Delivery Options` or `checkDeliveryFee` endpoints.
            

        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | orderId | yes | string | Order number for which you want to create a
        reverse shipment. |

        | pickupLocationCode | no | string | Predefined pickup address of
        branches/warehouses from `Create Pickup Location` endpoint. |

        | deliveryOptionId | no | string | Activated delivery company option id.
        |

        | pickingType |  | enum | Possible values:  <br>PICKUP_BY_DC: Shipping
        company offers free pickup from origin. BRANCH_DROP_OFF: Package must be
        delivered to a branch of the shipping company. |

        | frontSideIDCard | no | string | URL of the front side of the
        recipient’s national ID card. Required for international shipments to
        Kuwait, Oman and Qatar. |

        | backSideIDCard | no | string | URL of the back side of the recipient’s
        national ID card. Required for international shipments to Kuwait, Oman
        and Qatar. |

        | items | no | Array | Array of items. |


        ###### Item fields definitions:


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | quantity | yes | string | Return quantity of item. |

        | sku | yes | string | Sku of return item. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  format: utc-millisec
                deliveryOptionId:
                  type: string
                  format: color
                pickupLocationCode:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      quantity:
                        type: string
                        format: utc-millisec
                      sku:
                        type: string
            example:
              orderId: '202111080914'
              deliveryOptionId: '156'
              pickupLocationCode: wh1
              items:
                - quantity: '1'
                  sku: SKU045857
