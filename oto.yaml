  /rest/v2/updateStockQuantity:
    post:
      summary: Update Stock Quantity
      parameters:
        - name: x-forwarded-authorization
          in: header
          schema:
            type: string
          example: Bearer {{staging-feasibility}}
      responses:
        '200':
          description: 200 actionType "set"
          headers:
            Date:
              schema:
                type: string
              example: Thu, 16 Nov 2023 10:45:14 GMT
            Content-Length:
              schema:
                type: integer
              example: '123'
            Server:
              schema:
                type: string
              example: Jetty(9.4.3.v20170317)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  warnings:
                    type: array
                    items:
                      type: string
                  transactionID:
                    type: integer
              example:
                success: true
                warnings:
                  - >-
                    Inventory quantity set to the given qty according to the
                    action type
                transactionID: 591611
        '400':
          description: 400 invalid quantity
          headers:
            Date:
              schema:
                type: string
              example: Thu, 16 Nov 2023 11:11:36 GMT
            Content-Length:
              schema:
                type: integer
              example: '65'
            Server:
              schema:
                type: string
              example: Jetty(9.4.3.v20170317)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  otoErrorCode:
                    type: string
                  otoErrorMessage:
                    type: string
              example:
                success: false
                otoErrorCode: OTO1132
                otoErrorMessage: Quantity is missing or invalid
      tags:
        - Stock Management
      description: >-
        **Available Packages:** Scale Package, Enterprise Package, Marketplaces


        This API endpoint enables efficient inventory management by allowing you
        to update the quantity of a SKU in two flexible ways:


        1. **Adjust**: Modify the existing quantity by adding or deducting a
        specified amount. To decrease the quantity, provide a negative value for
        `qty`. For example, setting `qty` to `-5` will deduct 5 units from the
        current stock.
            
        2. **Set**: Directly set the quantity on hand to a specific value,
        replacing the current stock with the provided `qty`.
            

        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | actionType | yes | enum | "set","adjust" |

        | locationCode | yes | string | Location code of the inventory |

        | sku | yes | string | SKU of the product in the inventory |

        | qty | yes | integer | Quantity to be set or adjusted in the inventory
        |
  /rest/v2/checkInventoryStock:
    get:
      summary: Check Inventory Stock
      parameters:
        - name: sku
          in: query
          schema:
            type: string
          example: SG1,SG2,SG3
      responses:
        '200':
          description: '200'
          headers:
            X-Cloud-Trace-Context:
              schema:
                type: string
              example: c4fe578fca49fa3b709de526ac5ecfc1
            Alt-Svc:
              schema:
                type: string
              example: clear
            Date:
              schema:
                type: string
              example: Mon, 13 Dec 2021 20:37:51 GMT
            Server:
              schema:
                type: string
              example: Google Frontend
            Content-Length:
              schema:
                type: integer
              example: '569'
            Via:
              schema:
                type: string
              example: 1.1 google
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stock:
                    type: object
                    properties:
                      SG1:
                        type: array
                        items:
                          type: object
                          properties:
                            pickupLocationCode:
                              type: string
                            sku:
                              type: string
                            quantityForecasted:
                              type: integer
                            quantityOnHand:
                              type: integer
                      SG3:
                        type: array
                        items:
                          type: object
                          properties:
                            pickupLocationCode:
                              type: string
                            sku:
                              type: string
                            quantityForecasted:
                              type: integer
                            quantityOnHand:
                              type: integer
                      SG2:
                        type: array
                        items:
                          type: object
                          properties:
                            pickupLocationCode:
                              type: string
                            sku:
                              type: string
                            quantityForecasted:
                              type: integer
                            quantityOnHand:
                              type: integer
              example:
                success: true
                stock:
                  SG1:
                    - pickupLocationCode: DMW
                      sku: SG1
                      quantityForecasted: 261
                      quantityOnHand: 277
                    - sku: SG1
                      quantityForecasted: -16
                      quantityOnHand: -7
                  SG3:
                    - pickupLocationCode: DMW
                      sku: SG3
                      quantityForecasted: 55
                      quantityOnHand: 67
                    - sku: SG3
                      quantityForecasted: -7
                      quantityOnHand: -6
                  SG2:
                    - pickupLocationCode: DMW
                      sku: SG2
                      quantityForecasted: 185
                      quantityOnHand: 198
                    - sku: SG2
                      quantityForecasted: -20
                      quantityOnHand: -12
      tags:
        - Stock Management
      description: >-
        **Available Packages:** Scale Package, Enterprise Package, Marketplaces


        This API endpoint allows you to retrieve real-time stock availability
        for products at specific locations.


        It provides detailed information on the quantity of items on hand and
        forecasted stock for each product at various pickup locations, offering
        a location-based view of inventory distribution.


        **Request Parameters:**


        | Name | Required | Type | **Description** |

        | --- | --- | --- | --- |

        | sku | yes | string | The product's SKU identifier |


        **Response:**


        - **success**: Indicates whether the request was successful (`true` or
        `false`).
            
        - **stock**: A dictionary with SKUs as keys, containing a list of stock
        details for each location:
            
            - **pickupLocationCode**: The code representing the specific location.
                
            - **sku**: The product's SKU identifier.
                
            - **quantityForecasted**: The forecasted stock level at the location.
                
            - **quantityOnHand**: The actual available stock at the location.
