        - Orders
      description: >-
        **Available Packages:** All Packages


        This API endpoint allows you to modify the current status of an order
        within the system.  

        You can update the order status to "delivered," "returned," if the order
        does not have an associated shipment. For "picked up" there should be an
        associated shipment. However, if a shipment exists, only statuses for
        integrator-managed shipments can be updated.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | orderIds | yes | string | Id of the order/s |

        | status | yes | string | status of the shipment(delivered, returned,
        pickedUp) |

        | description | no | string | description of the status change |

        | date | no | date | the delivery date of the order |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderIds:
                  type: array
                  items:
                    type: integer
                status:
                  type: string
                date:
                  type: string
                  format: date-time
                description:
                  type: string
                  format: color
            example:
              orderIds:
                - 30846946
              status: delivered
              date: '2024-08-06T21:00:00.000Z'
              description: aaaaaa
