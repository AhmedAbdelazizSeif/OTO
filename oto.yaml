        (client store) details. This endpoint enables users to retrieve
        information about brands associated with their account, including key
        attributes such as brand name, store identifiers, and other relevant
        metadata.


        **Request Parameters:**


        No request body parameters are required for this GET request.


        **Response:**


        Upon a successful execution, the server responds with a 200 status code
        and a JSON object containing the following fields:


        - `success` (boolean) - Indicates the success status of the request.
            
