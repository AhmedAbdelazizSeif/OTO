      description: >-
        **Available Packages:** Starter Package, Scale Package, Enterprise
        Package, Marketplaces


        This API endpoint provides a list of all delivery companies integrated
        with OTO. If you have a contract with any of these companies, you can
        connect your account to OTO. Use the company's unique code to configure
        settings through the **DC Activation** and **DC Config** API endpoints.


        If a delivery company you have a contract with is not listed, please
        notify us to initiate the integration process.
  /rest/v2/dcConfig:
    post:
      summary: DC Config
      responses:
        '200':
          description: '200'
          headers:
            X-Cloud-Trace-Context:
              schema:
                type: string
              example: 665037e4022cd58163e6ab40071a6d60
            Alt-Svc:
              schema:
                type: string
              example: clear
            Date:
              schema:
                type: string
              example: Mon, 08 Nov 2021 06:50:09 GMT
            Server:
              schema:
                type: string
              example: Google Frontend
            Content-Length:
              schema:
                type: integer
              example: '943'
            Via:
              schema:
                type: string
              example: 1.1 google
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: array
                    items:
                      type: object
                      properties:
                        fieldName:
                          type: string
                        parentJson:
                          type: string
                        fieldType:
                          type: string
                  success:
                    type: boolean
                  exampleJSON:
                    type: object
                    properties:
                      delivery_fee:
                        type: integer
                      rating:
                        type: integer
                      ClientInfo:
                        type: object
                        properties:
                          UserName:
                            type: string
                          Version:
                            type: string
                          AccountPin:
                            type: string
                          AccountCountryCode:
                            type: string
                          AccountEntity:
                            type: string
                          Source:
                            type: integer
                          Password:
                            type: string
                          AccountNumber:
                            type: string
                      productType:
                        type: string
              example:
                settings:
                  - fieldName: UserName
                    parentJson: ClientInfo
                    fieldType: string
                  - fieldName: Password
                    parentJson: ClientInfo
                    fieldType: string
                  - fieldName: Version
                    parentJson: ClientInfo
                    fieldType: string
                  - fieldName: AccountNumber
                    parentJson: ClientInfo
                    fieldType: string
                  - fieldName: AccountPin
                    parentJson: ClientInfo
                    fieldType: string
                  - fieldName: AccountEntity
                    parentJson: ClientInfo
                    fieldType: string
                  - fieldName: AccountCountryCode
                    parentJson: ClientInfo
                    fieldType: string
                  - fieldName: Source
                    parentJson: ClientInfo
                    fieldType: string
                  - fieldName: productType
                    fieldType: enum
                    enumValues: EPX,CDS,OND,GPX,GDX,DPX,DDX,PLX,PPX,PDX
                success: true
                exampleJSON:
                  delivery_fee: 0
                  rating: 0
                  ClientInfo:
                    UserName: ''
                    Version: v1
                    AccountPin: ''
                    AccountCountryCode: SA
                    AccountEntity: RUH
                    Source: 24
                    Password: ''
                    AccountNumber: ''
                  productType: CDS
      tags:
        - Carrier Integrations
      description: >-
        **Available Packages**: Starter Package, Scale Package, Enterprise
        Package, Marketplaces


        This API endpoint allows you to view the required account credentials
        and the template for the delivery company specified in the request,
        which are needed for the next step: DC activation.  

        Retrieve the delivery company configuration template.  

        Use this template to create a valid configuration object, similar to the
        given `exampleJson`.  

        This configuration object is then used to activate the delivery company
        with the `DC Activation` API endpoint.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | code | yes | string | The integration name obtained from the DC List.
        |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
            example:
              code: aramex
  /rest/v2/dcActivation:
    post:
      summary: DC Activation
      responses:
        '200':
          description: '200'
          headers:
            X-Cloud-Trace-Context:
              schema:
                type: string
              example: f474b1f2ae9d6506663056823aae78a0;o=1
            Alt-Svc:
              schema:
                type: string
              example: clear
            Date:
              schema:
                type: string
              example: Mon, 08 Nov 2021 06:53:45 GMT
            Server:
              schema:
                type: string
              example: Google Frontend
            Content-Length:
              schema:
                type: integer
              example: '53'
            Via:
              schema:
                type: string
              example: 1.1 google
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deliveryOptionId:
                    type: string
                    format: color
              example:
                success: true
                deliveryOptionId: '123'
      tags:
        - Carrier Integrations
      description: >-
        **Available Packages:** Starter Package, Scale Package, Enterprise
        Package, Marketplaces


        This API endpoint is used to perform Delivery Company (DC) activation.
        It enables you to activate a delivery company by providing the required
        configuration details.


        **Request Parameters:**


        | Name | Required | Type | Description |

        | --- | --- | --- | --- |

        | code | yes | string | The integration name obtained from the `DC
        List.` |

        | deliveryOptionName | yes | string | A name you assign to easily
        identify this configuration. |

        | brandId | no | number | id of the brand created by `Create Brand`
        endpoint |

        | settings | yes | object | A configuration object created based on the
        example provided by the `DC Config` endpoint. |


        Note: You can activate 1 DC for the Free package and 3 DC for the
        Starter package and unlimited for other packages.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                deliveryOptionName:
                  type: string
                settings:
                  type: object
                  properties:
                    ClientInfo:
                      type: object
                      properties:
                        UserName:
                          type: string
                          format: email
                        Version:
                          type: string
                        AccountPin:
                          type: string
                          format: color
                        AccountCountryCode:
                          type: string
                        AccountEntity:
                          type: string
                        Source:
                          type: integer
                        Password:
                          type: string
                          format: color
                        AccountNumber:
                          type: string
                          format: color
                    productType:
                      type: string
            example:
              code: aramex
              deliveryOptionName: api test aramex
              settings:
                ClientInfo:
                  UserName: apitest@example.com
                  Version: v1
                  AccountPin: '123'
                  AccountCountryCode: SA
                  AccountEntity: RUH
                  Source: 24
                  Password: 123abc
                  AccountNumber: '123456'
                productType: CDS
  /rest/v2/getDeliveryOptions:
    get:
      summary: Get Delivery Options
      responses:
        '200':
          description: '200'
          headers:
            X-Cloud-Trace-Context:
              schema:
                type: string
              example: d4eae5a4fbb49159a85b0764c0a0e8d5;o=1
            Alt-Svc:
              schema:
                type: string
              example: clear
            Date:
              schema:
                type: string
              example: Tue, 02 Nov 2021 13:22:59 GMT
            Server:
              schema:
                type: string
              example: Google Frontend
            Content-Length:
              schema:
                type: integer
              example: '1565'
            Via:
              schema:
                type: string
              example: 1.1 google
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        deliveryOptionId:
                          type: integer
                        integrationName:
                          type: string
              example:
                success: true
